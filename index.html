<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Product Search</title>

	<style>
		:root{
			--bg:#f6f8fb;
			--panel:#ffffff;
			--line:#dfe5ee;
			--text:#1f2937;
			--muted:#667085;
			--accent:#2563eb;
			--accent-hover:#1d4ed8;
			--accent-soft:#e8f0ff;
			--ok:#157347;
			--ok-soft:#dcfce7;
			--warn:#b42318;
			--danger:#b42318;
			--shadow:0 12px 30px rgba(15,23,42,.08);
		}

		*{
			margin:0;
			padding:0;
			box-sizing:border-box;
			font-family:Inter,Arial,Helvetica,sans-serif;
		}

		body{
			min-height:100vh;
			background:var(--bg);
			color:var(--text);
		}

		.shell{
			width:min(1280px,calc(100% - 32px));
			margin:0 auto;
			padding:28px 0 56px;
		}

		.header{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:20px;
			margin-bottom:18px;
		}

		.logo-block{
			display:flex;
			flex-direction:column;
			gap:2px;
		}

		.logo{
			font-size:28px;
			font-weight:750;
			letter-spacing:-0.02em;
		}

		.logo-sub{
			color:var(--muted);
			font-size:14px;
		}

		.header-actions{
			display:flex;
			align-items:center;
			gap:10px;
		}

		.nav-link,
		.status{
			display:inline-flex;
			align-items:center;
			gap:8px;
			min-height:34px;
			padding:0 12px;
			border:1px solid var(--line);
			border-radius:999px;
			background:var(--panel);
			color:var(--muted);
			font-size:14px;
			text-decoration:none;
			white-space:nowrap;
			transition:border-color .15s,background .15s,color .15s;
		}

		.nav-link:hover{
			border-color:#b8c2d1;
			background:#f8fafc;
			color:var(--text);
		}

		.status-dot{
			width:8px;
			height:8px;
			border-radius:50%;
			background:var(--muted);
		}

		.status.connected .status-dot{ background:var(--ok); }
		.status.error .status-dot,
		.status.disconnected .status-dot{ background:var(--warn); }

		.layout{
			display:grid;
			grid-template-columns:minmax(0,1fr) 390px;
			gap:18px;
			align-items:start;
		}

		.search-wrap,
		.cart-panel{
			position:sticky;
			top:0;
			z-index:2;
			padding-top:12px;
			background:var(--bg);
		}

		.search{
			display:grid;
			grid-template-columns:44px 1fr 36px;
			align-items:center;
			min-height:58px;
			border:1px solid var(--line);
			border-radius:8px;
			background:var(--panel);
			box-shadow:var(--shadow);
			transition:border-color .15s,box-shadow .15s;
		}

		.search:focus-within{
			border-color:#93b4f5;
			box-shadow:0 0 0 3px rgba(37,99,235,.12),var(--shadow);
		}

		.search-icon{
			display:grid;
			place-items:center;
			color:var(--muted);
			font-size:20px;
		}

		.search input{
			width:100%;
			min-width:0;
			border:0;
			outline:none;
			background:transparent;
			color:var(--text);
			font-size:19px;
			line-height:1.3;
		}

		.clear{
			width:28px;
			height:28px;
			border:0;
			border-radius:50%;
			background:transparent;
			color:var(--muted);
			font-size:22px;
			line-height:28px;
			cursor:pointer;
			visibility:hidden;
		}

		.clear.visible{ visibility:visible; }
		.clear:hover{ background:#eef2f7; color:var(--text); }

		.meta-bar{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:12px;
			margin:12px 2px 0;
			color:var(--muted);
			font-size:14px;
		}

		.results{
			display:grid;
			gap:10px;
			margin-top:10px;
		}

		.card,
		.cart-card{
			border:1px solid var(--line);
			border-radius:8px;
			background:var(--panel);
		}

		.card{
			display:grid;
			grid-template-columns:78px minmax(0,1fr) auto;
			gap:14px;
			align-items:center;
			min-height:104px;
			padding:12px;
			transition:box-shadow .15s,border-color .15s,transform .15s;
		}

		.card:hover{
			border-color:#cbd5e1;
			box-shadow:0 8px 24px rgba(15,23,42,.08);
			transform:translateY(-1px);
		}

		.thumb-wrap{
			display:grid;
			place-items:center;
			width:78px;
			height:78px;
			border:1px solid #edf1f6;
			border-radius:8px;
			background:#fbfcfe;
			overflow:hidden;
		}

		.thumb{
			width:70px;
			height:70px;
			object-fit:contain;
		}

		.content{
			flex:1;
			min-width:0;
		}

		.title{
			display:-webkit-box;
			-webkit-line-clamp:2;
			-webkit-box-orient:vertical;
			overflow:hidden;
			color:#111827;
			font-size:17px;
			font-weight:700;
			line-height:1.25;
		}

		.info-row{
			display:flex;
			flex-wrap:wrap;
			gap:8px;
			align-items:center;
			margin-top:8px;
			color:var(--muted);
			font-size:13px;
		}

		.badge{
			max-width:100%;
			padding:4px 10px;
			border-radius:999px;
			background:var(--accent-soft);
			color:#1d4ed8;
			font-size:13px;
			font-weight:500;
			overflow:hidden;
			text-overflow:ellipsis;
			white-space:nowrap;
		}

		.nutriscore{
			height:32px;
			width:auto;
		}

		.ingredients{
			margin-top:10px;
			font-size:14px;
			color:#555;
			line-height:1.5;
			display:-webkit-box;
			-webkit-line-clamp:2;
			-webkit-box-orient:vertical;
			overflow:hidden;
		}

		.ingredients .allergen{
			font-weight:700;
			color:#b91c1c;
		}

		.barcode{
			display:inline-flex;
			align-items:center;
			max-width:100%;
			padding:3px 7px;
			border:1px solid var(--line);
			border-radius:6px;
			color:#475467;
			background:#f8fafc;
			font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
			font-size:12px;
			overflow:hidden;
			text-overflow:ellipsis;
			white-space:nowrap;
		}

		.add-area{
			display:flex;
			align-items:center;
			gap:8px;
		}

		.qty-control{
			display:grid;
			grid-template-columns:32px 54px 32px;
			height:34px;
			border:1px solid var(--line);
			border-radius:8px;
			overflow:hidden;
			background:#fff;
		}

		.qty-control button,
		.add-button,
		.remove-button,
		.page-button,
		.clear-cart,
		.cart-action{
			border:0;
			background:transparent;
			cursor:pointer;
			font-weight:700;
		}

		.qty-control button{
			color:var(--text);
			font-size:18px;
			transition:background .12s;
		}

		.qty-control button:hover{ background:#f1f5f9; }

		.qty-control input{
			width:54px;
			border:0;
			border-inline:1px solid var(--line);
			text-align:center;
			outline:none;
			font-size:14px;
		}

		.add-button{
			height:34px;
			padding:0 14px;
			border-radius:8px;
			background:var(--accent);
			color:#fff;
			white-space:nowrap;
			transition:background .15s,transform .1s;
		}

		.add-button:hover{ background:var(--accent-hover); }
		.add-button:active{ transform:scale(.97); }
		.add-button.added{ background:var(--ok); }
		.add-button.added:hover{ background:#11633a; }

		.empty{
			display:grid;
			place-items:center;
			gap:8px;
			min-height:220px;
			padding:24px;
			border:1px dashed var(--line);
			border-radius:8px;
			color:var(--muted);
			background:rgba(255,255,255,.65);
			text-align:center;
		}

		.empty-title{
			color:var(--text);
			font-size:16px;
			font-weight:650;
		}

		.skeleton{
			position:relative;
			overflow:hidden;
		}

		.skeleton::after{
			content:"";
			position:absolute;
			inset:0;
			background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
			animation:shine 1.1s infinite;
		}

		@keyframes shine{
			from{ transform:translateX(-100%); }
			to{ transform:translateX(100%); }
		}

		.pager{
			display:none;
			align-items:center;
			justify-content:center;
			gap:10px;
			margin-top:18px;
		}

		.pager.visible{ display:flex; }

		.page-button{
			min-width:92px;
			height:38px;
			border:1px solid var(--line);
			border-radius:8px;
			background:var(--panel);
			color:var(--text);
			font-size:14px;
		}

		.page-button:hover:not(:disabled){
			border-color:#b8c2d1;
			background:#f8fafc;
		}

		.page-button:disabled{
			color:#98a2b3;
			cursor:not-allowed;
		}

		.page-label{
			min-width:82px;
			color:var(--muted);
			font-size:14px;
			text-align:center;
		}

		.cart-panel{
			max-height:calc(100vh - 16px);
			overflow:auto;
		}

		.cart-box{
			border:1px solid var(--line);
			border-radius:8px;
			background:var(--panel);
			box-shadow:var(--shadow);
			overflow:hidden;
		}

		.cart-head{
			display:flex;
			align-items:flex-start;
			justify-content:space-between;
			gap:12px;
			padding:14px;
			border-bottom:1px solid var(--line);
		}

		.cart-title{
			font-size:18px;
			font-weight:750;
		}

		.cart-summary{
			color:var(--muted);
			font-size:13px;
			margin-top:2px;
		}

		.cart-head-actions{
			display:flex;
			align-items:center;
			gap:6px;
		}

		.clear-cart,
		.cart-action{
			padding:4px 8px;
			border-radius:6px;
			font-size:13px;
			transition:background .12s;
		}

		.clear-cart{ color:var(--danger); }
		.clear-cart:hover{ background:#fef2f2; }

		.cart-action{
			color:var(--muted);
		}

		.cart-action:hover{
			background:#f1f5f9;
			color:var(--text);
		}

		.cart-list{
			display:grid;
			gap:0;
			max-height:min(52vh,520px);
			overflow:auto;
		}

		.cart-card{
			display:grid;
			grid-template-columns:56px minmax(0,1fr);
			gap:12px;
			padding:12px 14px;
			border:0;
			border-bottom:1px solid var(--line);
			border-radius:0;
			transition:background .12s;
		}

		.cart-card:hover{ background:#fafbfc; }
		.cart-card:last-child{ border-bottom:0; }

		.cart-card .thumb-wrap{
			width:56px;
			height:56px;
		}

		.cart-card .thumb{
			width:50px;
			height:50px;
		}

		.cart-row-bottom{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:10px;
			margin-top:8px;
		}

		.remove-button{
			padding:4px 8px;
			border-radius:6px;
			color:var(--danger);
			font-size:13px;
			font-weight:600;
			transition:background .12s;
		}

		.remove-button:hover{ background:#fef2f2; }

		.cart-empty{
			display:grid;
			place-items:center;
			gap:6px;
			padding:36px 14px;
			color:var(--muted);
			text-align:center;
		}

		.cart-footer{
			padding:14px;
			border-top:1px solid var(--line);
			background:#fafbfc;
		}

		.cart-totals{
			display:grid;
			gap:6px;
			margin-bottom:12px;
		}

		.cart-total-row{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:12px;
			font-size:14px;
		}

		.cart-total-row strong{
			font-size:16px;
		}

		.save-status{
			display:flex;
			align-items:center;
			gap:6px;
			margin-top:10px;
			color:var(--muted);
			font-size:12px;
		}

		.save-status.saved{ color:var(--ok); }
		.save-status.error{ color:var(--danger); }

		.toast{
			position:fixed;
			bottom:24px;
			left:50%;
			transform:translateX(-50%) translateY(80px);
			z-index:100;
			display:flex;
			align-items:center;
			gap:8px;
			padding:10px 16px;
			border-radius:999px;
			background:#111827;
			color:#fff;
			font-size:14px;
			font-weight:500;
			box-shadow:0 8px 30px rgba(0,0,0,.25);
			opacity:0;
			pointer-events:none;
			transition:transform .25s ease,opacity .25s ease;
		}

		.toast.visible{
			transform:translateX(-50%) translateY(0);
			opacity:1;
		}

		mark{
			border-radius:3px;
			background:#fff2a8;
			color:inherit;
		}

		@media (max-width:960px){
			.layout{ grid-template-columns:1fr; }

			.cart-panel{
				position:static;
				max-height:none;
				order:-1;
			}

			.cart-list{ max-height:none; }
		}

		@media (max-width:640px){
			.shell{
				width:min(100% - 20px,1280px);
				padding-top:18px;
			}

			.header{
				align-items:flex-start;
				flex-direction:column;
				gap:10px;
			}

			.header-actions{
				width:100%;
				justify-content:space-between;
			}

			.logo{ font-size:24px; }

			.card{
				grid-template-columns:66px minmax(0,1fr);
			}

			.add-area{
				grid-column:1 / -1;
				justify-content:flex-end;
			}

			.thumb-wrap{
				width:66px;
				height:66px;
			}

			.thumb{
				width:58px;
				height:58px;
			}
		}
	</style>
</head>

<body>
<main class="shell">
	<header class="header">
		<div class="logo">Product Search</div>
		<div class="header-actions">
			<a class="nav-link" href="/cart">Cart</a>
			<div id="status" class="status">
				<span class="status-dot"></span>
				<span id="statusText">Connecting</span>
			</div>
		</div>
	</header>

	<section class="search-wrap">
		<div class="search">
			<div class="search-icon">⌕</div>
			<input id="search" placeholder="Search products" autocomplete="off" autofocus>
			<button id="clear" class="clear" type="button" aria-label="Clear search">×</button>
		</div>
		<div class="meta-bar">
			<span id="count"></span>
			<span id="latency"></span>
		</div>
	</section>

	<section id="results" class="results">
		<div class="empty">Start typing to search.</div>
	</section>

	<nav id="pager" class="pager" aria-label="Search result pages">
		<button id="prevPage" class="page-button" type="button">Previous</button>
		<span id="pageLabel" class="page-label">Page 1</span>
		<button id="nextPage" class="page-button" type="button">Next</button>
	</nav>
</main>

<script>
  const ws = new WebSocket(`ws://${location.host}`);
  const placeholder = "https://placehold.co/160x160/f8fafc/64748b?text=No+image";

  const search = document.getElementById("search");
  const results = document.getElementById("results");
  const count = document.getElementById("count");
  const latency = document.getElementById("latency");
  const status = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const clearButton = document.getElementById("clear");
  const pager = document.getElementById("pager");
  const prevPage = document.getElementById("prevPage");
  const nextPage = document.getElementById("nextPage");
  const pageLabel = document.getElementById("pageLabel");
  const SEARCH_IDLE_DELAY = 650;

  let timer;
  let requestId = 0;
  let currentPage = 1;
  let hasNextPage = false;
  const requestStartedAt = new Map();

  ws.onopen = () => setStatus("connected", "Connected");
  ws.onclose = () => setStatus("disconnected", "Disconnected");
  ws.onerror = () => setStatus("error", "Error");

  ws.onmessage = event => {
	const response = JSON.parse(event.data);

	if (response.requestId && response.requestId !== requestId) return;

	if (response.error) {
	  results.innerHTML = `<div class="empty">${escapeHtml(response.error)}</div>`;
	  count.textContent = "";
	  latency.textContent = "";
	  return;
	}

	const startedAt = requestStartedAt.get(response.requestId);

	if (startedAt) {
	  latency.textContent = `${Math.round(performance.now() - startedAt)} ms`;
	  requestStartedAt.delete(response.requestId);
	}

	renderResults(response.data || []);
	currentPage = response.page || currentPage;
	hasNextPage = Boolean(response.hasMore);
	count.textContent = `Page ${currentPage} · ${response.count || 0} results`;
	updatePager(response.count || 0);
  };

  function setStatus(state, label) {
	status.className = `status ${state}`;
	statusText.textContent = label;
  }

  function nutriscoreUrl(grade) {
	const valid = ["a", "b", "c", "d", "e"];
	const g = String(grade || "unknown").toLowerCase();
	return `https://static.openfoodfacts.org/images/misc/nutriscore-${valid.includes(g) ? g : "unknown"}.svg`;
  }

  function renderResults(products) {
	const terms = getSearchTerms();

	if (products.length === 0) {
	  results.innerHTML = `<div class="empty">No matching products</div>`;
	  updatePager(0);
	  return;
	}

	results.innerHTML = products.map(product => {
	  const name = highlight(product.product_name || "Unknown product", terms);
	  const brand = escapeHtml(product.brands || "");
	  // const quantity = escapeHtml(product.quantity || "");
	  const packQuantity = escapeHtml(product.quantity || "");
	  const barcode = escapeHtml(String(product._id || product.code || ""));
	  const imageUrl = escapeAttribute(product.awsImageUrl || product.image_url || placeholder);
	  const ingredients_text_with_allergens = escapeHtml(product.ingredients_text_with_allergens || "");
	  const grade = escapeAttribute(product.nutrition_grade || "unknown");

	  return `
		<article class="card">
			<div class="thumb-wrap">
				<img class="thumb" src="${imageUrl}" alt="" loading="lazy" onerror="this.src='${placeholder}'">
			</div>
			<div class="content">
				<div class="title">${name}</div>
				<div class="brand-row">
					${brand ? `<span class="badge">${brand}</span>` : ""}
					${packQuantity ? `<span class="badge">${packQuantity}</span>` : ""}
					<img class="nutriscore" src="${nutriscoreUrl(grade)}" alt="Nutri-Score ${grade}" loading="lazy">
					<span class="barcode">${escapeHtml(barcode)}</span>
				</div>
				${product.ingredients_text_with_allergens ? `<div class="ingredients">${product.ingredients_text_with_allergens}</div>` : ""}
			</div>
		</article>
	  `;
	}).join("");

	// <div className="brand-row">
	//   ${brand ? `<span class="badge">${brand}</span>` : ""}
	//   ${quantity ? `<span class="quantity">${quantity}</span>` : ""}
	//   ${barcode ? `<span class="barcode">${barcode}</span>` : ""}
	//   ${ingredients_text_with_allergens ? `<span class="barcode">${ingredients_text_with_allergens}</span>` : ""}
	// </div>
  }

  function highlight(text, terms) {
	let escaped = escapeHtml(text);

	for (const term of terms) {
	  const regex = new RegExp(`(${escapeRegex(term)})`, "ig");
	  escaped = escaped.replace(regex, "<mark>$1</mark>");
	}

	return escaped;
  }

  function query() {
	if (ws.readyState !== WebSocket.OPEN) return;

	const terms = getSearchTerms();

	clearButton.classList.toggle("visible", search.value.trim().length > 0);

	if (terms.length === 0) {
	  results.innerHTML = `<div class="empty">Start typing to search.</div>`;
	  count.textContent = "";
	  latency.textContent = "";
	  updatePager(0);
	  return;
	}

	requestId += 1;
	requestStartedAt.set(requestId, performance.now());
	count.textContent = "Searching";
	latency.textContent = "";

	ws.send(JSON.stringify({
	  requestId,
	  searchTerms: terms,
	  page: currentPage
	}));
  }

  function renderLoading() {
	results.innerHTML = Array.from({ length: 6 }, () => `
	  <article class="card">
		<div class="thumb-wrap skeleton"></div>
		<div class="content">
		  <div class="title skeleton" style="height:22px;width:70%;border-radius:6px;"></div>
		  <div class="brand-row">
			<span class="badge skeleton" style="width:130px;height:24px;"></span>
			<span class="quantity skeleton" style="width:80px;height:16px;border-radius:6px;"></span>
		  </div>
		</div>
	  </article>
	`).join("");
  }

  function handleSearchInput() {
	clearTimeout(timer);
	currentPage = 1;

	const terms = getSearchTerms();
	const hasText = search.value.trim().length > 0;

	clearButton.classList.toggle("visible", hasText);

	if (terms.length === 0) {
	  results.innerHTML = `<div class="empty">Start typing to search.</div>`;
	  count.textContent = "";
	  latency.textContent = "";
	  updatePager(0);
	  return;
	}

	count.textContent = "Typing";
	latency.textContent = "";
	updatePager(0);
	renderLoading();
	timer = setTimeout(query, SEARCH_IDLE_DELAY);
  }

  function goToPage(page) {
	const terms = getSearchTerms();

	if (terms.length === 0) return;

	currentPage = Math.max(1, page);
	count.textContent = "Searching";
	latency.textContent = "";
	updatePager(0);
	renderLoading();
	query();
	window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function updatePager(resultCount) {
	const shouldShow = resultCount > 0 || currentPage > 1 || hasNextPage;

	pager.classList.toggle("visible", shouldShow);
	pageLabel.textContent = `Page ${currentPage}`;
	prevPage.disabled = currentPage <= 1;
	nextPage.disabled = !hasNextPage;
  }

  function getSearchTerms() {
	return [...new Set(search.value
	  .trim()
	  .toLowerCase()
	  .split(/\s+/)
	  .filter(term => term.length >= 2)
	  .slice(0, 6)
	)];
  }

  function escapeHtml(value) {
	return String(value).replace(/[&<>"']/g, char => ({
	  "&": "&amp;",
	  "<": "&lt;",
	  ">": "&gt;",
	  '"': "&quot;",
	  "'": "&#39;"
	}[char]));
  }

  function escapeAttribute(value) {
	return escapeHtml(value).replace(/`/g, "&#96;");
  }

  function escapeRegex(value) {
	return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  search.addEventListener("input", () => {
	handleSearchInput();
  });

  clearButton.addEventListener("click", () => {
	search.value = "";
	clearButton.classList.remove("visible");
	handleSearchInput();
	search.focus();
  });

  prevPage.addEventListener("click", () => {
	goToPage(currentPage - 1);
  });

  nextPage.addEventListener("click", () => {
	goToPage(currentPage + 1);
  });
</script>
</body>
</html>
