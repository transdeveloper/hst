<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Cart</title>

	<style>
		:root{
			--bg:#f6f8fb;
			--panel:#ffffff;
			--line:#dfe5ee;
			--text:#1f2937;
			--muted:#667085;
			--accent:#2563eb;
			--accent-hover:#1d4ed8;
			--accent-soft:#e8f0ff;
			--ok:#157347;
			--ok-soft:#dcfce7;
			--warn:#b42318;
			--danger:#b42318;
			--shadow:0 12px 30px rgba(15,23,42,.08);
		}

		*{
			margin:0;
			padding:0;
			box-sizing:border-box;
			font-family:Inter,Arial,Helvetica,sans-serif;
		}

		body{
			min-height:100vh;
			background:var(--bg);
			color:var(--text);
		}

		.shell{
			width:min(1280px,calc(100% - 32px));
			margin:0 auto;
			padding:28px 0 56px;
		}

		.header{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:20px;
			margin-bottom:18px;
		}

		.logo-block{
			display:flex;
			flex-direction:column;
			gap:2px;
		}

		.logo{
			font-size:28px;
			font-weight:750;
			letter-spacing:-0.02em;
		}

		.logo-sub{
			color:var(--muted);
			font-size:14px;
		}

		.header-actions{
			display:flex;
			align-items:center;
			gap:10px;
		}

		.nav-link,
		.status{
			display:inline-flex;
			align-items:center;
			gap:8px;
			min-height:34px;
			padding:0 12px;
			border:1px solid var(--line);
			border-radius:999px;
			background:var(--panel);
			color:var(--muted);
			font-size:14px;
			text-decoration:none;
			white-space:nowrap;
			transition:border-color .15s,background .15s,color .15s;
		}

		.nav-link:hover{
			border-color:#b8c2d1;
			background:#f8fafc;
			color:var(--text);
		}

		.status-dot{
			width:8px;
			height:8px;
			border-radius:50%;
			background:var(--muted);
		}

		.status.connected .status-dot{ background:var(--ok); }
		.status.error .status-dot,
		.status.disconnected .status-dot{ background:var(--warn); }

		.layout{
			display:grid;
			grid-template-columns:minmax(0,1fr) 390px;
			gap:18px;
			align-items:start;
		}

		.search-wrap,
		.cart-panel{
			position:sticky;
			top:0;
			z-index:2;
			padding-top:12px;
			background:var(--bg);
		}

		.search{
			display:grid;
			grid-template-columns:44px 1fr 36px;
			align-items:center;
			min-height:58px;
			border:1px solid var(--line);
			border-radius:8px;
			background:var(--panel);
			box-shadow:var(--shadow);
			transition:border-color .15s,box-shadow .15s;
		}

		.search:focus-within{
			border-color:#93b4f5;
			box-shadow:0 0 0 3px rgba(37,99,235,.12),var(--shadow);
		}

		.search-icon{
			display:grid;
			place-items:center;
			color:var(--muted);
			font-size:20px;
		}

		.search input{
			width:100%;
			min-width:0;
			border:0;
			outline:none;
			background:transparent;
			color:var(--text);
			font-size:19px;
			line-height:1.3;
		}

		.clear{
			width:28px;
			height:28px;
			border:0;
			border-radius:50%;
			background:transparent;
			color:var(--muted);
			font-size:22px;
			line-height:28px;
			cursor:pointer;
			visibility:hidden;
		}

		.clear.visible{ visibility:visible; }
		.clear:hover{ background:#eef2f7; color:var(--text); }

		.meta-bar{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:12px;
			margin:12px 2px 0;
			color:var(--muted);
			font-size:14px;
			padding-bottom: 10px;
		}

		.results{
			display:grid;
			gap:10px;
			margin-top:10px;
		}

		.card,
		.cart-card{
			border:1px solid var(--line);
			border-radius:8px;
			background:var(--panel);
		}

		.card{
			display:grid;
			grid-template-columns:78px minmax(0,1fr) auto;
			gap:14px;
			align-items:start;
			min-height:104px;
			padding:12px;
			transition:box-shadow .15s,border-color .15s,transform .15s;
		}

		.card:hover{
			border-color:#cbd5e1;
			box-shadow:0 8px 24px rgba(15,23,42,.08);
			transform:translateY(-1px);
		}

		.thumb-wrap{
			display:grid;
			place-items:center;
			width:78px;
			height:78px;
			border:1px solid #edf1f6;
			border-radius:8px;
			background:#fbfcfe;
			overflow:hidden;
		}

		.thumb{
			width:70px;
			height:70px;
			object-fit:contain;
		}

		.content{
			flex:1;
			min-width:0;
		}

		.title{
			display:-webkit-box;
			-webkit-line-clamp:2;
			-webkit-box-orient:vertical;
			overflow:hidden;
			color:#111827;
			font-size:17px;
			font-weight:700;
			line-height:1.25;
		}

		.info-row{
			display:flex;
			flex-wrap:wrap;
			gap:8px;
			align-items:center;
			margin-top:8px;
			color:var(--muted);
			font-size:13px;
		}

		.badge{
			max-width:100%;
			padding:4px 10px;
			border-radius:999px;
			background:var(--accent-soft);
			color:#1d4ed8;
			font-size:13px;
			font-weight:500;
			overflow:hidden;
			text-overflow:ellipsis;
			white-space:nowrap;
		}

		.nutriscore{
			height:32px;
			width:auto;
		}

		.ingredients-block{
			margin-top:10px;
			border:1px solid #e8edf3;
			border-radius:8px;
			background:#f8fafc;
			overflow:hidden;
		}

		.ingredients-label{
			padding:6px 10px;
			border-bottom:1px solid #e8edf3;
			color:var(--muted);
			font-size:11px;
			font-weight:650;
			letter-spacing:.04em;
			text-transform:uppercase;
		}

		.ingredients-body{
			padding:8px 10px 10px;
		}

		.ingredients-text{
			color:#374151;
			font-size:13px;
			line-height:1.65;
		}

		.ingredients-block:not(.expanded) .ingredients-text{
			max-height:4.95em;
			overflow:hidden;
			-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 62%,transparent 100%);
			mask-image:linear-gradient(to bottom,#000 0%,#000 62%,transparent 100%);
		}

		.ingredients-text .allergen{
			font-weight:700;
			color:#b91c1c;
			background:#fef2f2;
			padding:0 2px;
			border-radius:2px;
		}

		.ingredients-toggle{
			margin-top:8px;
			padding:0;
			border:0;
			background:none;
			color:var(--accent);
			font-size:13px;
			font-weight:600;
			cursor:pointer;
			text-align:left;
		}

		.ingredients-toggle:hover{
			color:var(--accent-hover);
			text-decoration:underline;
		}

		.ingredients-block.expanded .ingredients-toggle{
			color:var(--muted);
		}

		.ingredients-block.expanded .ingredients-toggle:hover{
			color:var(--text);
		}

		.barcode{
			display:inline-flex;
			align-items:center;
			max-width:100%;
			padding:3px 7px;
			border:1px solid var(--line);
			border-radius:6px;
			color:#475467;
			background:#f8fafc;
			font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
			font-size:12px;
			overflow:hidden;
			text-overflow:ellipsis;
			white-space:nowrap;
		}

		.add-area{
			display:flex;
			align-items:center;
			gap:8px;
			align-self:center;
		}

		.qty-control{
			display:grid;
			grid-template-columns:32px 54px 32px;
			height:34px;
			border:1px solid var(--line);
			border-radius:8px;
			overflow:hidden;
			background:#fff;
		}

		.qty-control button,
		.add-button,
		.remove-button,
		.page-button,
		.clear-cart,
		.cart-action{
			border:0;
			background:transparent;
			cursor:pointer;
			font-weight:700;
		}

		.qty-control button{
			color:var(--text);
			font-size:18px;
			transition:background .12s;
		}

		.qty-control button:hover{ background:#f1f5f9; }

		.qty-control input{
			width:54px;
			border:0;
			border-inline:1px solid var(--line);
			text-align:center;
			outline:none;
			font-size:14px;
		}

		.add-button{
			height:34px;
			padding:0 14px;
			border-radius:8px;
			background:var(--accent);
			color:#fff;
			white-space:nowrap;
			transition:background .15s,transform .1s;
		}

		.add-button:hover{ background:var(--accent-hover); }
		.add-button:active{ transform:scale(.97); }
		.add-button.added{ background:var(--ok); }
		.add-button.added:hover{ background:#11633a; }

		.empty{
			display:grid;
			place-items:center;
			gap:8px;
			min-height:220px;
			padding:24px;
			border:1px dashed var(--line);
			border-radius:8px;
			color:var(--muted);
			background:rgba(255,255,255,.65);
			text-align:center;
		}

		.empty-title{
			color:var(--text);
			font-size:16px;
			font-weight:650;
		}

		.skeleton{
			position:relative;
			overflow:hidden;
		}

		.skeleton::after{
			content:"";
			position:absolute;
			inset:0;
			background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
			animation:shine 1.1s infinite;
		}

		@keyframes shine{
			from{ transform:translateX(-100%); }
			to{ transform:translateX(100%); }
		}

		.pager{
			display:none;
			align-items:center;
			justify-content:center;
			gap:10px;
			margin-top:18px;
		}

		.pager.visible{ display:flex; }

		.page-button{
			min-width:92px;
			height:38px;
			border:1px solid var(--line);
			border-radius:8px;
			background:var(--panel);
			color:var(--text);
			font-size:14px;
		}

		.page-button:hover:not(:disabled){
			border-color:#b8c2d1;
			background:#f8fafc;
		}

		.page-button:disabled{
			color:#98a2b3;
			cursor:not-allowed;
		}

		.page-label{
			min-width:82px;
			color:var(--muted);
			font-size:14px;
			text-align:center;
		}

		.cart-panel{
			max-height:calc(100vh - 16px);
			overflow:auto;
		}

		.cart-box{
			border:1px solid var(--line);
			border-radius:8px;
			background:var(--panel);
			box-shadow:var(--shadow);
			overflow:hidden;
		}

		.cart-head{
			display:flex;
			align-items:flex-start;
			justify-content:space-between;
			gap:12px;
			padding:14px;
			border-bottom:1px solid var(--line);
		}

		.cart-title{
			font-size:18px;
			font-weight:750;
		}

		.cart-summary{
			color:var(--muted);
			font-size:13px;
			margin-top:2px;
		}

		.cart-head-actions{
			display:flex;
			align-items:center;
			gap:6px;
		}

		.clear-cart,
		.cart-action{
			padding:4px 8px;
			border-radius:6px;
			font-size:13px;
			transition:background .12s;
		}

		.clear-cart{ color:var(--danger); }
		.clear-cart:hover{ background:#fef2f2; }

		.cart-action{
			color:var(--muted);
		}

		.cart-action:hover{
			background:#f1f5f9;
			color:var(--text);
		}

		.cart-list{
			display:grid;
			gap:0;
			max-height:min(52vh,520px);
			overflow:auto;
		}

		.cart-card{
			display:grid;
			grid-template-columns:56px minmax(0,1fr);
			gap:12px;
			padding:12px 14px;
			border:0;
			border-bottom:1px solid var(--line);
			border-radius:0;
			transition:background .12s;
		}

		.cart-card:hover{ background:#fafbfc; }
		.cart-card:last-child{ border-bottom:0; }

		.cart-card .thumb-wrap{
			width:56px;
			height:56px;
		}

		.cart-card .thumb{
			width:50px;
			height:50px;
		}

		.cart-row-bottom{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:10px;
			margin-top:8px;
		}

		.remove-button{
			padding:4px 8px;
			border-radius:6px;
			color:var(--danger);
			font-size:13px;
			font-weight:600;
			transition:background .12s;
		}

		.remove-button:hover{ background:#fef2f2; }

		.cart-empty{
			display:grid;
			place-items:center;
			gap:6px;
			padding:36px 14px;
			color:var(--muted);
			text-align:center;
		}

		.cart-footer{
			padding:14px;
			border-top:1px solid var(--line);
			background:#fafbfc;
		}

		.cart-totals{
			display:grid;
			gap:6px;
			margin-bottom:12px;
		}

		.cart-total-row{
			display:flex;
			align-items:center;
			justify-content:space-between;
			gap:12px;
			font-size:14px;
		}

		.cart-total-row strong{
			font-size:16px;
		}

		.save-status{
			display:flex;
			align-items:center;
			gap:6px;
			margin-top:10px;
			color:var(--muted);
			font-size:12px;
		}

		.save-status.saved{ color:var(--ok); }
		.save-status.error{ color:var(--danger); }

		.toast{
			position:fixed;
			bottom:24px;
			left:50%;
			transform:translateX(-50%) translateY(80px);
			z-index:100;
			display:flex;
			align-items:center;
			gap:8px;
			padding:10px 16px;
			border-radius:999px;
			background:#111827;
			color:#fff;
			font-size:14px;
			font-weight:500;
			box-shadow:0 8px 30px rgba(0,0,0,.25);
			opacity:0;
			pointer-events:none;
			transition:transform .25s ease,opacity .25s ease;
		}

		.toast.visible{
			transform:translateX(-50%) translateY(0);
			opacity:1;
		}

		mark{
			border-radius:3px;
			background:#fff2a8;
			color:inherit;
		}

		@media (max-width:960px){
			.layout{ grid-template-columns:1fr; }

			.cart-panel{
				position:static;
				max-height:none;
				order:-1;
			}

			.cart-list{ max-height:none; }
		}

		@media (max-width:640px){
			.shell{
				width:min(100% - 20px,1280px);
				padding-top:18px;
			}

			.header{
				align-items:flex-start;
				flex-direction:column;
				gap:10px;
			}

			.header-actions{
				width:100%;
				justify-content:space-between;
			}

			.logo{ font-size:24px; }

			.card{
				grid-template-columns:66px minmax(0,1fr);
			}

			.add-area{
				grid-column:1 / -1;
				justify-content:flex-end;
			}

			.thumb-wrap{
				width:66px;
				height:66px;
			}

			.thumb{
				width:58px;
				height:58px;
			}
		}
	</style>
</head>

<body>
<main class="shell">
	<header class="header">
		<div class="logo-block">
			<div class="logo">Cart</div>
			<div class="logo-sub" id="cartSummaryTop">0 products · 0 total</div>
		</div>
		<div class="header-actions">
			<div id="status" class="status">
				<span class="status-dot"></span>
				<span id="statusText">Connecting</span>
			</div>
		</div>
	</header>

	<div class="layout">
		<section>
			<div class="search-wrap">
				<div class="search">
					<div class="search-icon" aria-hidden="true">⌕</div>
					<input id="search" placeholder="Search by product, brand, or barcode" autocomplete="off" autofocus>
					<button id="clear" class="clear" type="button" aria-label="Clear search">×</button>
				</div>
				<div class="meta-bar">
					<span id="count"></span>
					<span id="latency"></span>
				</div>
			</div>

			<section id="results" class="results">
				<div class="empty">
					<span class="empty-title">Find products to add</span>
					<span>Search by name, brand, or barcode, then set a quantity and tap Add.</span>
				</div>
			</section>

			<nav id="pager" class="pager" aria-label="Search result pages">
				<button id="prevPage" class="page-button" type="button">Previous</button>
				<span id="pageLabel" class="page-label">Page 1</span>
				<button id="nextPage" class="page-button" type="button">Next</button>
			</nav>
		</section>

		<aside class="cart-panel">
			<div class="cart-box">
				<div class="cart-head">
					<div>
						<div class="cart-title">Shopping Cart</div>
						<div class="cart-summary" id="cartSummary">0 products · 0 total</div>
					</div>
					<div class="cart-head-actions">
						<button id="copyCart" class="cart-action" type="button" title="Copy cart as JSON">Copy</button>
						<button id="clearCart" class="clear-cart" type="button">Clear</button>
					</div>
				</div>
				<div id="cartList" class="cart-list">
					<div class="cart-empty">
						<span>Your cart is empty</span>
					</div>
				</div>
				<div id="cartFooter" class="cart-footer" hidden>
					<div class="cart-totals">
						<div class="cart-total-row">
							<span>Unique products</span>
							<span id="cartProductCount">0</span>
						</div>
						<div class="cart-total-row">
							<span>Total items</span>
							<strong id="cartItemCount">0</strong>
						</div>
					</div>
					<div id="saveStatus" class="save-status" aria-live="polite"></div>
				</div>
			</div>
		</aside>
	</div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  const ws = new WebSocket(`ws://${location.host}`);
  const placeholder = "https://placehold.co/160x160/f8fafc/64748b?text=No+image";
  const SEARCH_IDLE_DELAY = 650;

  const search = document.getElementById("search");
  const results = document.getElementById("results");
  const count = document.getElementById("count");
  const latency = document.getElementById("latency");
  const status = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const clearButton = document.getElementById("clear");
  const pager = document.getElementById("pager");
  const prevPage = document.getElementById("prevPage");
  const nextPage = document.getElementById("nextPage");
  const pageLabel = document.getElementById("pageLabel");
  const cartList = document.getElementById("cartList");
  const cartSummary = document.getElementById("cartSummary");
  const cartSummaryTop = document.getElementById("cartSummaryTop");
  const cartFooter = document.getElementById("cartFooter");
  const cartProductCount = document.getElementById("cartProductCount");
  const cartItemCount = document.getElementById("cartItemCount");
  const saveStatus = document.getElementById("saveStatus");
  const clearCartBtn = document.getElementById("clearCart");
  const copyCartBtn = document.getElementById("copyCart");
  const toast = document.getElementById("toast");

  let timer;
  let toastTimer;
  let requestId = 0;
  let currentPage = 1;
  let hasNextPage = false;
  let lastProducts = [];
  let cart = {};
  const requestStartedAt = new Map();

  loadCart();

  ws.onopen = () => setStatus("connected", "Connected");
  ws.onclose = () => setStatus("disconnected", "Disconnected");
  ws.onerror = () => setStatus("error", "Error");

  function onlyQuantitiesChanged(oldCart = {}, newCart = {}) {
	const oldKeys = Object.keys(oldCart);
	const newKeys = Object.keys(newCart);

	if (oldKeys.length !== newKeys.length) {
	  return false;
	}

	for (const barcode of oldKeys) {
	  const oldItem = oldCart[barcode];
	  const newItem = newCart[barcode];

	  if (!newItem) {
		return false;
	  }

	  const { quantity: _, ...oldRest } = oldItem;
	  const { quantity: __, ...newRest } = newItem;

	  if (JSON.stringify(oldRest) !== JSON.stringify(newRest)) {
		return false;
	  }
	}

	return true;
  }

  ws.onmessage = event => {
	const response = JSON.parse(event.data);

	if (response.type === "CART_UPDATED") {
	  const newCart = response.cart || {};

	  if (onlyQuantitiesChanged(cart, newCart)) {
		// Only update quantities
		for (const barcode in newCart) {
		  cart[barcode].quantity = newCart[barcode].quantity;
		}
	  } else {
		// Items added/removed or product data changed
		cart = newCart;
		saveCart();
	  }

	  renderCart();
	  return;
	}

	// TODO: Fix race condition (Where multiple clients trying to update the cart at the same time causes the cart to be out of sync)

	if (response.requestId && response.requestId !== requestId) return; // so we ignore prev responses that are no longer relevant

	if (response.error) {
	  results.innerHTML = `<div class="empty"><span class="empty-title">${escapeHtml(response.error)}</span></div>`;
	  count.textContent = "";
	  latency.textContent = "";
	  return;
	}

	const startedAt = requestStartedAt.get(response.requestId);

	if (startedAt) {
	  latency.textContent = `${Math.round(performance.now() - startedAt)} ms`;
	  requestStartedAt.delete(response.requestId);
	}

	lastProducts = response.data || [];
	currentPage = response.page || currentPage;
	hasNextPage = Boolean(response.hasMore);
	renderResults(lastProducts);
	count.textContent = `Page ${currentPage} · ${response.count || 0} results`;
	updatePager(response.count || 0);
  };

  function setStatus(state, label) {
	status.className = `status ${state}`;
	statusText.textContent = label;
  }

  function nutriscoreUrl(grade) {
	const valid = ["a", "b", "c", "d", "e"];
	const g = String(grade || "unknown").toLowerCase();
	return `https://static.openfoodfacts.org/images/misc/nutriscore-${valid.includes(g) ? g : "unknown"}.svg`;
  }

  function renderIngredientsBlock(html) {
	return `
		<div class="ingredients-block">
			<div class="ingredients-label">
			Ingredients
			</div>
			<div class="ingredients-body">
				<div class="ingredients-text">${html}</div>
				<button type="button" class="ingredients-toggle" data-action="toggle-ingredients" aria-expanded="false" hidden>Show full ingredients</button>
			</div>
		</div>`;
  }

  function setupIngredientToggles() {
	results.querySelectorAll(".ingredients-block").forEach(block => {
	  const text = block.querySelector(".ingredients-text");
	  const toggle = block.querySelector(".ingredients-toggle");
	  if (!text || !toggle) return;

	  const allergenCount = text.querySelectorAll(".allergen").length;
	  const expandLabel = allergenCount > 0
		? `Show full ingredients (${allergenCount} allergen${allergenCount === 1 ? "" : "s"})`
		: "Show full ingredients";

	  toggle.dataset.collapsedLabel = expandLabel;
	  toggle.dataset.expandedLabel = "Show less";

	  if (text.scrollHeight > text.clientHeight + 1) {
		toggle.textContent = expandLabel;
		toggle.hidden = false;
	  } else {
		block.classList.add("expanded");
	  }
	});
  }

  function renderResults(products) {
	const terms = getSearchTerms();

	if (products.length === 0) {
	  results.innerHTML = `
		<div class="empty">
			<span class="empty-title">No matching products</span>
			<span>Try different keywords or a barcode.</span>
		</div>`;
	  updatePager(0);
	  return;
	}

	results.innerHTML = products.map(product => {
	  const barcode = getBarcode(product);
	  const cartQty = cart[barcode]?.quantity || 1;
	  const name = highlight(product.product_name || "Unknown product", terms);
	  const brand = escapeHtml(product.brands || "");
	  const packQuantity = escapeHtml(product.quantity || "");
	  const imageUrl = escapeAttribute(product.awsImageUrl || product.image_url || placeholder);
	  const added = Boolean(cart[barcode]);
	  const grade = escapeAttribute(product.nutrition_grade || "unknown");

	  return `
		<article class="card" data-barcode="${escapeAttribute(barcode)}">
			<div class="thumb-wrap">
				<img class="thumb" src="${imageUrl}" alt="" loading="lazy" onerror="this.src='${placeholder}'">
			</div>
			<div class="content">
				<div class="title">${name}</div>
				<div class="info-row">
					${brand ? `<span class="badge">${brand}</span>` : ""}
					${packQuantity ? `<span class="badge">${packQuantity}</span>` : ""}
					<img class="nutriscore" src="${nutriscoreUrl(grade)}" alt="Nutri-Score ${grade}" loading="lazy">
					<span class="barcode">${escapeHtml(barcode)}</span>
				</div>
				${product.ingredients_text_with_allergens ? renderIngredientsBlock(product.ingredients_text_with_allergens) : ""}
			</div>
			<div class="add-area">
				<div class="qty-control">
					<button type="button" data-action="result-dec" data-barcode="${escapeAttribute(barcode)}" aria-label="Decrease quantity">−</button>
					<input data-role="result-qty" data-barcode="${escapeAttribute(barcode)}" value="${cartQty}" inputmode="numeric" aria-label="Quantity">
					<button type="button" data-action="result-inc" data-barcode="${escapeAttribute(barcode)}" aria-label="Increase quantity">+</button>
				</div>
				<button class="add-button ${added ? "added" : ""}" type="button" data-action="add" data-barcode="${escapeAttribute(barcode)}">${added ? "Update" : "Add"}</button>
			</div>
		</article>`;
	}).join("");

	setupIngredientToggles();
  }

  function renderCart() {
	const items = Object.values(cart);
	const totalQuantity = items.reduce((sum, item) => sum + item.quantity, 0);
	const summary = `${items.length} product${items.length === 1 ? "" : "s"} · ${totalQuantity} total`;

	cartSummary.textContent = summary;
	cartSummaryTop.textContent = summary;
	cartFooter.hidden = items.length === 0;
	cartProductCount.textContent = items.length;
	cartItemCount.textContent = totalQuantity;
	copyCartBtn.disabled = items.length === 0;

	if (items.length === 0) {
	  cartList.innerHTML = `
		<div class="cart-empty">
			<span>Your cart is empty</span>
		</div>`;
	  return;
	}

	cartList.innerHTML = items.map(item => {
	  const imageUrl = escapeAttribute(item.imageUrl || placeholder);

	  return `
		<article class="cart-card" data-barcode="${escapeAttribute(item.barcode)}">
			<div class="thumb-wrap">
				<img class="thumb" src="${imageUrl}" alt="" loading="lazy" onerror="this.src='${placeholder}'">
			</div>
			<div class="content">
				<div class="title">${escapeHtml(item.name)}</div>
				<div class="info-row">
					${item.brand ? `<span class="badge">${escapeHtml(item.brand)}</span>` : ""}
					${item.packQuantity ? `<span class="badge">${escapeHtml(item.packQuantity)}</span>` : ""}
					<span class="barcode">${escapeHtml(item.barcode)}</span>
				</div>
				<div class="cart-row-bottom">
					<div class="qty-control">
						<button type="button" data-action="cart-dec" data-barcode="${escapeAttribute(item.barcode)}" aria-label="Decrease quantity">−</button>
						<input data-role="cart-qty" data-barcode="${escapeAttribute(item.barcode)}" value="${item.quantity}" inputmode="numeric" aria-label="Quantity">
						<button type="button" data-action="cart-inc" data-barcode="${escapeAttribute(item.barcode)}" aria-label="Increase quantity">+</button>
					</div>
					<button class="remove-button" type="button" data-action="remove" data-barcode="${escapeAttribute(item.barcode)}">Remove</button>
				</div>
			</div>
		</article>`;
	}).join("");
  }

  function addOrUpdateCartItem(barcode) {
	const product = lastProducts.find(item => getBarcode(item) === barcode);
	const input = document.querySelector(`[data-role="result-qty"][data-barcode="${cssEscape(barcode)}"]`);
	const quantity = normalizeQuantity(input?.value || 1);

	if (!product) return;

	const isUpdate = Boolean(cart[barcode]);

	cart[barcode] = {
	  barcode,
	  quantity,
	  name: product.product_name || "Unknown product",
	  brand: product.brands || "",
	  packQuantity: product.quantity || "",
	  imageUrl: product.awsImageUrl || product.image_url || ""
	};

	saveCart();
	renderCart();
	renderResults(lastProducts);
	showToast(isUpdate ? `Updated to ${quantity}×` : `Added ${quantity}× to cart`);
  }

  function updateCartQuantity(barcode, quantity) {
	if (!cart[barcode]) return;

	cart[barcode].quantity = normalizeQuantity(quantity);
	saveCart();
	renderCart();
	renderResults(lastProducts);
  }

  function removeCartItem(barcode) {
	const name = cart[barcode]?.name;
	delete cart[barcode];
	saveCart();
	renderCart();
	renderResults(lastProducts);
	if (name) showToast(`Removed ${name}`);
  }

  function setResultQuantity(barcode, quantity) {
	const normalized = normalizeQuantity(quantity);
	const input = document.querySelector(`[data-role="result-qty"][data-barcode="${cssEscape(barcode)}"]`);
	if (input) input.value = normalized;
  }

  function query() {
	if (ws.readyState !== WebSocket.OPEN) return;

	const terms = getSearchTerms();

	clearButton.classList.toggle("visible", search.value.trim().length > 0);

	if (terms.length === 0) {
	  results.innerHTML = `
		<div class="empty">
			<span class="empty-title">Find products to add</span>
			<span>Search by name, brand, or barcode, then set a quantity and tap Add.</span>
		</div>`;
	  count.textContent = "";
	  latency.textContent = "";
	  updatePager(0);
	  return;
	}

	requestId += 1;
	requestStartedAt.set(requestId, performance.now());
	count.textContent = "Searching";
	latency.textContent = "";

	ws.send(JSON.stringify({
	  requestId,
	  searchTerms: terms,
	  page: currentPage
	}));
  }

  function renderLoading() {
	results.innerHTML = Array.from({ length: 6 }, () => `
	  <article class="card">
		<div class="thumb-wrap skeleton"></div>
		<div class="content">
		  <div class="title skeleton" style="height:22px;width:70%;border-radius:6px;"></div>
		  <div class="info-row">
			<span class="badge skeleton" style="width:130px;height:24px;"></span>
			<span class="barcode skeleton" style="width:120px;height:22px;"></span>
		  </div>
		</div>
		<div class="add-area">
		  <div class="qty-control skeleton"></div>
		  <span class="add-button skeleton" style="width:64px;"></span>
		</div>
	  </article>
	`).join("");
  }

  function handleSearchInput() {
	clearTimeout(timer);
	currentPage = 1;

	const terms = getSearchTerms();
	const hasText = search.value.trim().length > 0;

	clearButton.classList.toggle("visible", hasText);

	if (terms.length === 0) {
	  results.innerHTML = `
		<div class="empty">
			<span class="empty-title">Find products to add</span>
			<span>Search by name, brand, or barcode, then set a quantity and tap Add.</span>
		</div>`;
	  count.textContent = "";
	  latency.textContent = "";
	  updatePager(0);
	  return;
	}

	count.textContent = "Typing";
	latency.textContent = "";
	updatePager(0);
	renderLoading();
	timer = setTimeout(query, SEARCH_IDLE_DELAY);
  }

  function goToPage(page) {
	const terms = getSearchTerms();
	if (terms.length === 0) return;

	currentPage = Math.max(1, page);
	count.textContent = "Searching";
	latency.textContent = "";
	updatePager(0);
	renderLoading();
	query();
	window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function updatePager(resultCount) {
	const shouldShow = resultCount > 0 || currentPage > 1 || hasNextPage;
	pager.classList.toggle("visible", shouldShow);
	pageLabel.textContent = `Page ${currentPage}`;
	prevPage.disabled = currentPage <= 1;
	nextPage.disabled = !hasNextPage;
  }

  function getSearchTerms() {
	return [...new Set(search.value
	  .trim()
	  .toLowerCase()
	  .split(/\s+/)
	  .filter(term => term.length >= 2)
	  .slice(0, 6)
	)];
  }

  function getBarcode(product) {
	return String(product._id || product.code || "").replace(/\D/g, "");
  }

  function normalizeQuantity(value) {
	const quantity = Number.parseInt(value, 10);
	if (!Number.isFinite(quantity) || quantity < 1) return 1;
	return Math.min(quantity, 999);
  }

  async function loadCart() {
	try {
	  const response = await fetch("/cart.json");
	  if (!response.ok) throw new Error(`HTTP ${response.status}`);
	  const data = await response.json();
	  cart = (data && typeof data === "object") ? data : {};
	} catch (err) {
	  console.error("Failed to load cart:", err);
	  cart = {};
	}
	renderCart();
  }

  async function saveCart() {
	saveStatus.textContent = "Saving…";
	saveStatus.className = "save-status";

	try {

	  ws.send(JSON.stringify({ type: "cartUpdate", cart }));

	  const response = await fetch("/cart.json", {
		method: "PUT",
		headers: { "Content-Type": "application/json" },
		body: JSON.stringify(cart)
	  });

	  if (!response.ok) throw new Error(`HTTP ${response.status}`);

	  saveStatus.textContent = "Saved";
	  saveStatus.className = "save-status saved";
	} catch (err) {
	  console.error("Failed to save cart:", err);
	  saveStatus.textContent = "Save failed";
	  saveStatus.className = "save-status error";
	}
  }

  function showToast(message) {
	toast.textContent = message;
	toast.classList.add("visible");
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => toast.classList.remove("visible"), 2200);
  }

  async function copyCartToClipboard() {
	const items = Object.values(cart);
	if (items.length === 0) return;

	const payload = JSON.stringify(cart, null, 2);

	try {
	  await navigator.clipboard.writeText(payload);
	  showToast("Cart copied to clipboard");
	} catch {
	  showToast("Could not copy cart");
	}
  }

  function highlight(text, terms) {
	let escaped = escapeHtml(text);
	for (const term of terms) {
	  const regex = new RegExp(`(${escapeRegex(term)})`, "ig");
	  escaped = escaped.replace(regex, "<mark>$1</mark>");
	}
	return escaped;
  }

  function escapeHtml(value) {
	return String(value).replace(/[&<>"']/g, char => ({
	  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
	}[char]));
  }

  function escapeAttribute(value) {
	return escapeHtml(value).replace(/`/g, "&#96;");
  }

  function escapeRegex(value) {
	return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function cssEscape(value) {
	if (window.CSS?.escape) return CSS.escape(value);
	return String(value).replace(/["\\]/g, "\\$&");
  }

  search.addEventListener("input", handleSearchInput);

  clearButton.addEventListener("click", () => {
	search.value = "";
	clearButton.classList.remove("visible");
	handleSearchInput();
	search.focus();
  });

  prevPage.addEventListener("click", () => goToPage(currentPage - 1));
  nextPage.addEventListener("click", () => goToPage(currentPage + 1));

  results.addEventListener("click", event => {
	const action = event.target.dataset.action;
	if (!action) return;

	if (action === "toggle-ingredients") {
	  const block = event.target.closest(".ingredients-block");
	  if (!block) return;

	  const expanded = block.classList.toggle("expanded");
	  event.target.textContent = expanded
		? event.target.dataset.expandedLabel
		: event.target.dataset.collapsedLabel;
	  event.target.setAttribute("aria-expanded", expanded);
	  return;
	}

	const barcode = event.target.dataset.barcode;
	if (!barcode) return;

	const currentValue = document.querySelector(`[data-role="result-qty"][data-barcode="${cssEscape(barcode)}"]`)?.value || 1;

	if (action === "result-dec") setResultQuantity(barcode, normalizeQuantity(currentValue) - 1);
	if (action === "result-inc") setResultQuantity(barcode, normalizeQuantity(currentValue) + 1);
	if (action === "add") addOrUpdateCartItem(barcode);
  });

  results.addEventListener("change", event => {
	if (event.target.dataset.role !== "result-qty") return;
	setResultQuantity(event.target.dataset.barcode, event.target.value);
  });

  cartList.addEventListener("click", event => {
	const action = event.target.dataset.action;
	const barcode = event.target.dataset.barcode;
	if (!action || !barcode) return;

	const currentValue = cart[barcode]?.quantity || 1;

	if (action === "cart-dec") updateCartQuantity(barcode, currentValue - 1);
	if (action === "cart-inc") updateCartQuantity(barcode, currentValue + 1);
	if (action === "remove") removeCartItem(barcode);
  });

  cartList.addEventListener("change", event => {
	if (event.target.dataset.role !== "cart-qty") return;
	updateCartQuantity(event.target.dataset.barcode, event.target.value);
  });

  clearCartBtn.addEventListener("click", () => {
	const count = Object.keys(cart).length;
	if (count === 0) return;
	if (!confirm(`Remove all ${count} product${count === 1 ? "" : "s"} from the cart?`)) return;

	cart = {};
	saveCart();
	renderCart();
	renderResults(lastProducts);
	showToast("Cart cleared");
  });

  copyCartBtn.addEventListener("click", copyCartToClipboard);
</script>
</body>
</html>
